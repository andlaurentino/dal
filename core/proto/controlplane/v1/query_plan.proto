syntax = "proto3";

package controlplane.v1;

option go_package = "github.com/andersonlaurentino/dal-core/proto/gen/controlplane/v1;controlplanev1";

// QueryPlanner is called by the broker to resolve which store(s)/
// connection(s)/table(s) should answer a query against a named Projection.
// A single-source Projection resolves to one `sources` entry with no age
// bounds. A multi-source Projection resolves to one entry per source,
// ordered youngest to oldest, each carrying the age window (min_age/
// max_age, seconds; unset means unbounded on that side) and column view
// broker needs to route and stitch pages across them.
service QueryPlanner {
  rpc ResolvePlan(ResolvePlanRequest) returns (ResolvePlanResponse);
}

message ResolvePlanRequest {
  string projection_name = 1;
}

// ColumnPlan is one resolved output column: read `source` from the
// underlying store, expose it to callers as `as` (equal to `source` for
// passthrough).
message ColumnPlan {
  string source = 1;
  string as     = 2;
}

// StorePlan is everything broker needs to execute a read against one
// resolved store.
message StorePlan {
  string store_type     = 1; // "postgres" | "datalake"
  string connection_ref = 2; // Connection to use
  string target          = 3; // table name (postgres) or lake path (datalake)
  string dsn              = 4; // resolved connection string, postgres only
  string endpoint          = 5; // S3-compatible endpoint (RustFS in this deployment), datalake only
  string bucket             = 6; // bucket name, datalake only

  // order_by/min_age_seconds/max_age_seconds are only set when this
  // StorePlan is one of several sources — how broker filters/orders this
  // source's rows relative to the others. order_by names the timestamp
  // column. has_min_age/has_max_age distinguish "0" from "unset" (the
  // youngest source has no min age, the oldest has no max age).
  string order_by         = 7;
  bool   has_min_age       = 8;
  int64  min_age_seconds    = 9;
  bool   has_max_age         = 10;
  int64  max_age_seconds      = 11;

  repeated ColumnPlan columns = 12;
}

message ResolvePlanResponse {
  // Sources has one entry for a single-source projection, or one entry
  // per source (ordered youngest to oldest) for a multi-source one.
  repeated StorePlan sources = 1;
}

# One-time Job that creates the shared MinIO bucket Datalake Connections
# point at (see examples/kafka-to-lake/connection-datalake.yaml). S3 doesn't
# auto-vivify buckets on PUT, so this has to run once before any kafka->lake
# Sync can write. Re-running is safe: `mc mb --ignore-existing` no-ops if the
# bucket is already there.
apiVersion: batch/v1
kind: Job
metadata:
  name: datalake-bucket-init
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          # Same Docker Hub retirement as minio/minio above — quay.io/minio/mc
          # is the maintained source now.
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
          command:
            - /bin/sh
            - -c
            - |
              mc alias set dal http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
              mc mb --ignore-existing dal/dal-lake
          env:
            - { name: MINIO_ROOT_USER, value: dalminio }
            - { name: MINIO_ROOT_PASSWORD, value: dalminio123 }

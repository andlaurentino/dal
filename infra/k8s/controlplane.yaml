apiVersion: v1
kind: ServiceAccount
metadata:
  name: controlplane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: controlplane-workermgr
rules:
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controlplane-workermgr
subjects:
  - kind: ServiceAccount
    name: controlplane
roleRef:
  kind: Role
  name: controlplane-workermgr
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlplane
  labels: { app: controlplane }
spec:
  replicas: 1
  selector:
    matchLabels: { app: controlplane }
  template:
    metadata:
      labels: { app: controlplane }
    spec:
      serviceAccountName: controlplane
      containers:
        - name: controlplane
          image: dal-controlplane:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: REDIS_ADDR, value: "redis:6379" }
            - { name: WORKER_IMAGE, value: "dal-workerd:latest" }
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
          ports:
            - containerPort: 8080
            - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: controlplane
spec:
  selector: { app: controlplane }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
    - { name: grpc, port: 9090, targetPort: 9090 }
---
# NodePort for host access (curl/browser) during local dev.
apiVersion: v1
kind: Service
metadata:
  name: controlplane-external
spec:
  type: NodePort
  selector: { app: controlplane }
  ports:
    - { name: http, port: 8080, targetPort: 8080, nodePort: 30800 }

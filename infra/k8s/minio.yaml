# Single-node MinIO (S3-compatible), backing the datalake Connection type:
# Delta tables written/read by workerd's kafka->lake and lake->postgres
# pipelines live here, one bucket shared across ingestions, each ingestion
# using its own path/prefix inside it (see infra/datalake/).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels: { app: minio }
spec:
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          # MinIO retired the minio/minio Docker Hub repo entirely (pulls
          # 404/ImagePullBackOff against it) and now only publishes to
          # quay.io/minio/minio, with no "latest" tag — pin a dated release.
          image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - { name: MINIO_ROOT_USER, value: dalminio }
            - { name: MINIO_ROOT_PASSWORD, value: dalminio123 }
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
# NodePorts for host-side inspection (mc CLI, browser console) during local dev.
apiVersion: v1
kind: Service
metadata:
  name: minio-external
spec:
  type: NodePort
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: 9000, nodePort: 30900 }
    - { name: console, port: 9001, targetPort: 9001, nodePort: 30901 }

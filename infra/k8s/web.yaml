apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app: web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: dal-web:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: CONTROLPLANE_URL, value: "http://controlplane:8080" }
            - { name: BROKER_URL, value: "http://broker:8081" }
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector: { app: web }
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300

apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
  labels: { app: broker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: broker }
  template:
    metadata:
      labels: { app: broker }
    spec:
      containers:
        - name: broker
          image: dal-broker:latest
          imagePullPolicy: IfNotPresent
          args: ["--http-addr=:8081", "--controlplane-addr=controlplane:9090"]
          env:
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: s3-credentials, key: access-key } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: s3-credentials, key: secret-key } }
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: broker
spec:
  selector: { app: broker }
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: broker-external
spec:
  type: NodePort
  selector: { app: broker }
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30810

apiVersion: dal.io/v1alpha1
kind: Sync
metadata:
  name: events-to-postgres
spec:
  source:
    connectionRef: kafka
    topic: user-events
  target:
    connectionRef: postgres
    table: user_events
  mode: streaming
  replication: delta
  schedule: ""
  mapping:
    keyField: event_id
    schema:
      - jsonPath: "$.event_id"
        column: event_id
        type: text
      - jsonPath: "$.user_id"
        column: user_id
        type: text
      - jsonPath: "$.event_type"
        column: event_type
        type: text
      - jsonPath: "$.occurred_at"
        column: occurred_at
        type: timestamptz
  consumerGroup: ""
  retention:
    days: 7
    timestampColumn: occurred_at

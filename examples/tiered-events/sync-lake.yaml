# Full-history sync: kafka -> lake, same topic/mapping as sync-postgres.yaml,
# no retention — this Delta table (with Change Data Feed enabled) is the
# durable record of every event ever produced.
apiVersion: dal.io/v1alpha1
kind: Sync
metadata:
  name: events-to-lake
spec:
  source:
    connectionRef: kafka-events
    topic: user-events
  target:
    connectionRef: minio-lake
    path: events/raw
  mode: streaming
  replication: delta
  schedule: ""
  mapping:
    keyField: event_id
    schema:
      - jsonPath: "$.event_id"
        column: event_id
        type: text
      - jsonPath: "$.user_id"
        column: user_id
        type: text
      - jsonPath: "$.event_type"
        column: event_type
        type: text
      - jsonPath: "$.occurred_at"
        column: occurred_at
        type: timestamptz
  consumerGroup: ""
